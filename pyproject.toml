[project]
name = "mini-projet-helios"
version = "0.1.0"
description = "Local photovoltaic production, sizing, and financial simulation dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "control>=0.10.2",
    "flet>=0.28.3",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pvlib>=0.13.1",
    "pyside6>=6.10.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scipy>=1.16.3",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
helios = "helios.__main__:run_server"

[tool.pytest.ini_options]
addopts = [
    "--cov=helios",
    "--cov-report=term-missing",
]
testpaths = [
    "helios/tests",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.10",
]

[tool.ruff]
target-version = "py312"
line-length = 88
